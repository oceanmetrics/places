# protectedseas_navigator: ProtectedSeas Navigator marine protected and managed areas (CC BY 4.0), from the Direct Data
# Export for API users. ProtectedSeas (Alex Driedger, 2026-10-16) welcomed Navigator in the gazetteer, sent the export
# (2026-08-27, Shapefile + CSV + GeoJSON) and asked us to key on ps_id, use the supplied areas, and keep current through
# the open Navigator API quarterly (5 requests per 10 s). the export already leaves out sites whose boundaries are
# withheld for redistribution. the Terms of Use (export package) include an indemnity for our distribution of the data.
# raw archive (Ben's Drive): My Drive/projects/oceanmetrics/data/raw/ProtectedSeas.net_NavigatorMap.org/ (export zips,
# readme, Terms of Use). the build reads an unzipped copy in cache/protectedseas_navigator/export/{csv,shp/<subset>/}.
slug: protectedseas_navigator
title: ProtectedSeas Navigator marine protected and managed areas
description: >-
  ProtectedSeas Navigator: a global database of verified marine protected and managed area regulations and boundaries
  (MPAs, fisheries management areas, vessel restricted areas, water quality and other area-based measures), with each
  site's Level of Fishing Protection (`lfp`, 1 least to 5 most; 0 a proposed site) and activity-by-activity regulation
  coding. Built from the Navigator Direct Data Export for API users (2026-08-27); inland-only sites (lakes, rivers,
  land) are left out. Boundaries over 10,000 vertices were simplified by ProtectedSeas to within 2.4 m or 9.6 m
  (`display_simplified`); the area fields (`total_area`, `total_marine_area`, km2) come from the full-resolution
  boundaries, so use them rather than areas recomputed from the geometry. The data summarise laws and regulations for
  information only: they are not a legal document, may be incomplete or out of date, and do not replace the official
  regulations (see https://navigatormap.org/methodology/).
authority: PSGID
place_type: managed_area
version: 1.0.0
cadence: quarterly
license: CC-BY-4.0
license_url: https://creativecommons.org/licenses/by/4.0/
license_note: >-
  ProtectedSeas' Navigator data is licensed under a Creative Commons Attribution 4.0 International License (export
  readme, 2026-08-27), subject to the Navigator Terms of Use for Data (informational use only; no warranty; an
  indemnity for distribution of the data or information derived from it). Federal regulation text is public domain.
attribution: >-
  Navigator Data Download, ProtectedSeas®. https://navigatormap.org/data-request (accessed 2026-10-19). Zetterlind et
  al. (2025), Navigator - a global database of verified marine protected and managed area regulations and boundaries,
  Scientific Data 12, 1212. https://doi.org/10.1038/s41597-025-05535-2. CC BY 4.0. Processed by Ocean Metrics.
citation: >-
  Zetterlind et al. (2025), Navigator - a global database of verified marine protected and managed area regulations
  and boundaries, Scientific Data, 12, 1212. https://doi.org/10.1038/s41597-025-05535-2; Navigator Data Download,
  ProtectedSeas®. https://navigatormap.org/data-request (accessed 2026-10-19).
providers:
  - {name: ProtectedSeas, roles: [producer, licensor], url: "https://navigatormap.org"}
source_page: https://map.navigatormap.org
source_title: ProtectedSeas Navigator
# the site's "most relevant webpage" (Navigator `url`, usually the managing authority); Navigator has no documented
# deep link to a site on its map yet
place_url: "{url}"
place_id: {template: "PSGID:{ps_id}", pattern: "^PSGID:[A-Za-z0-9_.-]+(:part(-\\d+)?)?$"}
name: "{site_name}"
source_id: "{ps_id}"
area_field: total_area
status:
  value: current
  source: https://navigatormap.org/methodology/
  date: data_last_edit
tile_properties: [place_id, name, designation, category_name, lfp, country]
tile_maxzoom: 12
spatial_sort: true
sources:
  - kind: navigator_export
    url: https://navigatormap.org/data-request
    item_id: Navigator_API_AllSites_082726
    export_label: Navigator Direct Data Export for API users, 2026-08-27
