# boem_ocs_withdrawals: OCS Withdrawal Areas (BOEM) (28), MarineCadastre scan 2026-10-20 #4
slug: boem_ocs_withdrawals
title: BOEM OCS withdrawal areas
description: >-
  Areas of the Outer Continental Shelf withdrawn, permanently or for a period, from oil and gas, renewable energy,
  sand or mineral leasing (28 polygons): presidential withdrawals under section 12 of the OCS Lands Act (43 U.S.C.
  1341), national marine sanctuaries and marine national monuments whose terms restrict leasing, and other areas
  (national parks, wildlife refuges, preserves). `WITHDRAW_TYPE` is BOEM's code (PRW presidential withdrawal, SMW
  sanctuary or monument, OTH other); `LEASE_TYPE_RESTRICTION` lists the restricted lease types by letter (as read
  from the item description: O oil and gas, R renewable energy, S sand, M minerals); `WITHDRAW_PERIOD` is
  'Indefinitely' or a date range; `DOCUMENT_1`, `DOCUMENT_2` and `MAP_URL` are HTML links as served. The id is the
  area's `ACRONYM` (BOEM:WD:GRNMS). A withdrawal overlaps the sanctuary or monument of the same name but is a
  distinct legal status. Not an official record of exact boundaries: for cartographic use only, not for area
  calculations.
