# boem_marine_minerals_leases: OCS Marine Minerals (sand, gravel, shell) lease areas (78), MarineCadastre scan 2026-10-20 #8
slug: boem_marine_minerals_leases
title: BOEM OCS marine minerals lease areas
description: >-
  Outer Continental Shelf areas where a government agency holds, or has asked for, a negotiated non-competitive lease
  or memorandum of agreement with BOEM's Marine Minerals Program to dredge sand, gravel or shell for shore
  protection, beach restoration or coastal restoration (OCS Lands Act section 8(k)) (78 polygons; Atlantic and Gulf).
  `LeaseStatus` (Active, Complete, Expired, Proposed) becomes `status` (lower-cased) and is copied verbatim to
  `status_upstream`; `ProjectID`, `BorrowArea`, volumes and dates follow. Lease numbers are served hyphenated
  (OCS-A-0505) and published in BOEM's formal form (BOEM:OCS-A 0505, the same serial series as the wind leases in
  `boem_wind_leases`, with no overlap); older agreements keep their state numbers (BOEM:OCS-FL-2000). The proposed
  lease served with the placeholder OCS-A-XXXX gets BOEM:OCS-A-XXXX until BOEM numbers it. OCS-G-23707 is served
  twice (Holly Beach 2002, LA and Collier County 2006, FL): the earlier effective date keeps the bare id, the other
  gets ':part'.
