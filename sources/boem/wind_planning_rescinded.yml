# boem_wind_planning_rescinded: BOEM wind planning areas rescinded on 2025-07-30 (outlines + blocks)
slug: boem_wind_planning_rescinded
title: BOEM offshore wind planning areas (rescinded 2025-07-30)
description: >-
  Wind energy areas, call areas and proposed-sale areas that BOEM de-designated on 2025-07-30 (BOEM notice
  "BOEM Rescinds Designated Wind Energy Areas on the Outer Continental Shelf"). Two BOEM layers are combined:
  the dissolved outlines (`component` = outline) and the OCS blocks and sub-blocks that make them up
  (`component` = block). Every row is `status` = rescinded, `status_date` = 2025-07-30; the native `AREA_STATUS`
  column keeps BOEM's own, stale value (the Oregon areas are still marked Active). The outline layer holds one
  row with no geometry and no attributes (OBJECTID 2068); it is dropped.
