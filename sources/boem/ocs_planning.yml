  The 27 Outer Continental Shelf planning areas BOEM uses for the National OCS Oil and Gas Leasing Program
  (Gulf 3, Pacific 4, Atlantic 4, Alaska 16). `PLANNING_AREA` is BOEM's three-letter code; `name` is the area's
  full name (hand-mapped in catalog/sources/boem/ocs_planning.yml).
