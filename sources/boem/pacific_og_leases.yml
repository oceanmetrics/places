# boem_pacific_og_leases: active Pacific oil and gas leases (34), BOEM's own ArcGIS Server
slug: boem_pacific_og_leases
title: BOEM Pacific active oil and gas leases
description: >-
  The 30 active oil and gas leases in the Pacific OCS (off California), from BOEM's Pacific Region map service
  (POC_Layers layer 7). The service lists 34 active leases; the other 4 are renewable energy leases
  (`LEASE_STATUS_CD` = RENACV, `SERIAL_TYPE_CODE` = R: OCS-P 0560, 0562, 0563, 0564), left out here because
  they are not oil and gas leases (the source exclusion is recorded in provenance.json). The offshore wind
  leases OCS-P 0562-0564 are in `boem_wind_leases`, with their dated status; OCS-P 0560 (a 4,260-acre renewable
  lease effective 2021-03-01, as served) is not in BOEM's wind lease layer. `LEASE_STATUS_CD` (also in
  `status_upstream`) is BOEM's own code (UNIT = committed to a unit, PROD = producing); `status` is `active` for
  all of them because the layer lists active leases only.
  Lease numbers are served as P00202 and published in BOEM's formal form `OCS-P 0202`.
authority: BOEM
place_type: lease
version: 1.1.0
cadence: weekly
license: CC-PDDC
license_url: https://www.usa.gov/publicdomain/label/1.0/
license_note: U.S. federal government work (BOEM / BSEE), public domain; the service carries no separate terms.
attribution: >-
  Bureau of Ocean Energy Management (BOEM) and Bureau of Safety and Environmental Enforcement (BSEE), Pacific
  Region. Public domain. Processed by Ocean Metrics.
providers:
  - {name: Bureau of Ocean Energy Management (BOEM), roles: [producer, licensor], url: "https://www.boem.gov/oil-gas-energy/mapping-and-data/pacific-cadastral-data"}
  - {name: Bureau of Safety and Environmental Enforcement (BSEE), roles: [producer], url: "https://www.bsee.gov"}
source_page: https://www.boem.gov/oil-gas-energy/mapping-and-data/pacific-cadastral-data
place_id:
  rule: lease
  pattern: '^BOEM:OCS-P \d{4}(:[a-z0-9-]+)?$'
name: "{LEASE_NUMBER|lease_number} oil and gas lease ({LEASE_STATUS_CD})"
source_id: "{LEASE_NUMBER}"
status:
  upstream: LEASE_STATUS_CD
  value: active
  source: https://gis.boem.gov/server/rest/services/BOEM_BSEE/POC_Layers/MapServer/7
  date: "field:LSE_STAT_EFF_DT"
sources:
  - kind: arcgis
    url: https://gis.boem.gov/server/rest/services/BOEM_BSEE/POC_Layers/MapServer/7
    item_id: ""
    expected_count: 30    # after `exclude`; the layer itself serves 34
    exclude:
      LEASE_STATUS_CD: [RENACV]   # renewable (wind) leases: in boem_wind_leases
    page_size: 1000
    # gis.boem.gov serves an incomplete certificate chain (no intermediate), so no client can verify it:
    # set to true if BOEM fixes the chain. the data are public and every row records its source_url.
    tls_verify: false
    format: geojson    # esrijson also supported (converted by erin_layers.geom.esri_json_to_geojson)
