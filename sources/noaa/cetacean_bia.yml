# noaa_cetacean_bia: Biologically Important Areas for cetaceans (CetMap, 2015) (131), MarineCadastre scan 2026-10-20 #7
slug: noaa_cetacean_bia
title: Biologically Important Areas for cetaceans (2015)
description: >-
  Biologically Important Areas (BIAs) for 24 cetacean species, stocks or populations in seven U.S. regions (East
  Coast, Gulf of Mexico, West Coast, Hawaii, Gulf of Alaska, Aleutian Islands and Bering Sea, Arctic), identified by
  NOAA's Cetacean Density and Distribution Mapping Working Group (CetMap) (131 polygons): reproductive areas, feeding
  areas, migratory corridors and areas of small and resident populations (`BIA_type`), each with species
  (`cmn_name`, `sci_name`, `stock_pop`), season (`BIA_time`, `BIA_months`) and migration direction. BIAs are not
  regulatory areas. The id is the source `BIA_ID` (NMFS:BIA:3). This is the 2015 BIA set (Van Parijs et al. 2015);
  the BIA II update (2023 onward) is not included. Publications using these data must cite Van Parijs et al. (2015)
  or the regional paper.
authority: NMFS
