  use. At least one of the following citations must be included in any publication or report that uses this data.
  The first citation covers the entire dataset and special issue publication, other citations are specific to each
  regional dataset" (the first is Van Parijs, Curtice & Ferguson (Eds.) 2015, Aquatic Mammals 41(1)). The required
  citation is in `attribution` and `citation`.
