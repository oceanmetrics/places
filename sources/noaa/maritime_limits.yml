# noaa_maritime_limits: U.S. maritime limits and boundaries (lines) (246), MarineCadastre first-15 layer 6
slug: noaa_maritime_limits
title: U.S. maritime limits and boundaries (lines)
description: >-
  NOAA Office of Coast Survey's U.S. Maritime Limits and Boundaries (v4.0) as lines: the 12 NM territorial sea
  (`component` = territorial_sea_12nm, 87), the 24 NM contiguous zone (contiguous_zone_24nm, 63) and the 200 NM
  EEZ and maritime boundaries with neighbours (eez_200nm, 96). Compiled to update the charted limits on NOAA
  charts: NOT FOR LEGAL USE.
