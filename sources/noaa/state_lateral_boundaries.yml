# noaa_state_lateral_boundaries: Offshore state lateral boundaries (lines) (19), MarineCadastre first-15 layer 5a
slug: noaa_state_lateral_boundaries
title: Offshore state lateral boundaries (lines)
description: >-
  The 19 lines that divide the offshore waters of adjacent coastal states (`statenames`, `statefips` as 'FIPS -
  FIPS'), with the legal source of each (`boundarysource`: Supreme Court opinion, BOEM unofficial boundary,
  ...). Lines, not polygons: the federal / state split is noaa_state_submerged_lands.
