# noaa_coral_protection_areas: Coral Protection Areas (NMFS, 50 CFR 648) (19), MarineCadastre scan 2026-10-20 #5
slug: noaa_coral_protection_areas
title: Coral protection areas (Northeast and Mid-Atlantic)
description: >-
  Deep-sea coral protection zones on the Northeast and Mid-Atlantic U.S. continental shelf and slope (19 polygons):
  the Mid-Atlantic broad and discrete canyon zones (50 CFR 648.372) and the New England coral protection areas
  (648.373), where bottom-tending commercial fishing gear (trawls, dredges, longlines, pots, gillnets) is
  prohibited. The id is the zone name (NMFS:CPA:block-canyon); `cfrsection` is the regulation as served (sections
  are renumbered more often than zones are renamed).
