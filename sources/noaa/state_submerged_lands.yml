# noaa_state_submerged_lands: U.S. state submerged lands (483), MarineCadastre first-15 layer 5b
slug: noaa_state_submerged_lands
title: U.S. state submerged lands
description: >-
  The 483 polygons of coastal submerged lands that the Submerged Lands Act (43 U.S.C. 1301 et seq.) grants to
  the states (3 nautical miles; 9 for Texas, Puerto Rico and Florida's Gulf coast), i.e. the state side of the
  federal / state split. The source carries no state or site name, only the statute (`statute`, `citation`,
  `codification`); the place name is generic and the id is the source OBJECTID.
