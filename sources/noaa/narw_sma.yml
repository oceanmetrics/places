# noaa_narw_sma: North Atlantic right whale Seasonal Management Areas (NMFS, 50 CFR 224.105) (10), MarineCadastre scan 2026-10-20 #6
slug: noaa_narw_sma
title: North Atlantic right whale Seasonal Management Areas
description: >-
  Seasonal Management Areas (SMAs) where vessels of 65 ft or longer must slow to 10 knots or less in season, to
  reduce ship strikes of endangered North Atlantic right whales (10 polygons; 50 CFR 224.105, 73 FR 60173, 2008),
  with the `restrictedperiod` (e.g. November 15 to April 30). The id is the area's `location`
  (NMFS:SMA:cape-cod-bay): four Mid-Atlantic port entrances share the CFR paragraph 224.105(a)(2)(ii).
