# noaa_pilot_boarding_areas: Pilot boarding areas (NOAA OCM) (168), MarineCadastre scan 2026-10-20 #9
slug: noaa_pilot_boarding_areas
title: Pilot boarding areas
description: >-
  Offshore locations where a pilot boards a vessel to take it through local waters (168 polygons; compulsory
  pilotage, see 46 CFR 15.812): a circle around a charted position or a defined area, with the station name and a
  position `description` (e.g. "2.0 nm 092 deg true from Gannet Rocks Light"). The layer has no id attribute, so the
  id is the station name (MC:pilot:adak-island); a station with several boarding areas (Saint Thomas Island has four)
  gets ':part', ':part-2', ... in objectid order.
