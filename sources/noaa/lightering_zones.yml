# noaa_lightering_zones: Lightering zones (federal and state; NOAA OCM) (122), MarineCadastre scan 2026-10-20 #10
slug: noaa_lightering_zones
title: Lightering zones
description: >-
  Federal and state lightering zones in U.S. waters (122 polygons): areas where the ship-to-ship transfer of oil or
  hazardous material in bulk is designated (e.g. the 33 CFR 156 subpart C zones Southtex, Gulfmex 2), prohibited,
  restricted, or has traditionally taken place (`areatype`), with the source of each in `comment`. The layer has no
  id attribute, so the id is the site name (MC:lightering:southtex); the second Penobscot Bay polygon gets ':part'
  (objectid order). Compiled by NOAA OCM, so the authority prefix is MC, not USCG.
authority: MC
place_type: navigation_measure
