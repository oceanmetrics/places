# noaa_submarine_cables: Submarine cable areas (2816), MarineCadastre first-15 layer 14
slug: noaa_submarine_cables
title: Submarine cable areas
description: >-
  The general footprint of commercial and research submarine cables in U.S. waters as 2,816 areas (polygons; the
  first-15 list calls them lines). A cable area may hold one or more cables; most records carry no cable name
  (`shortname`, `cablesystem`, `owner` mostly empty), so names fall back to a generic label plus the source
  OBJECTID, which is the id. The native `status` (In Service, ...) is empty for 2,411 records, so `status` is
  'charted'.
