# noaa_mpa_inventory: NOAA Marine Protected Areas Inventory (981), MarineCadastre first-15 layer 2
slug: noaa_mpa_inventory
title: NOAA Marine Protected Areas Inventory
description: >-
  The NOAA MPA Center's Inventory (v2024) of 981 existing marine protected areas of the United States: federal,
  state, territorial and tribal sites with protection level, governance, fishing restrictions and IUCN category.
  The inventory compiles site boundaries from the managing agencies (`Mgmt_Agen`), so the item's disclaimers
  apply (not for navigation, not a legal document).
