# uscg_anchorages: Anchorages (USCG, 33 CFR 110) (679), MarineCadastre scan 2026-10-20 #3
slug: uscg_anchorages
title: Anchorages (USCG)
description: >-
  Anchorage grounds and special anchorage areas in U.S. waters (679 polygons) from 33 CFR part 110 (and the 33 CFR
  166.200 fairway anchorages off Texas), with name, type (`anchoragetype`: special, unrestricted, general,
  explosives, naval ...), location and effective date. The id is the CFR section plus the anchorage name
  (USCG:ANCH:110-182-a-1:anchorage-a): one section often lists several anchorages. Four anchorages without a CFR
  section use their location instead (USCG:ANCH:duck-island-ny:anchorage-area); a repeat of the same section and
  name (two polygons of one fairway anchorage) gets ':part' in objectid order.
