search_fields: [F_NAME, OCEAN, NAME_FR, NAME_ES]
column_docs:
  ID: the feature id on FAO's GeoServer (fao:<F_CODE>)
  F_CODE: FAO area code (18 to 88); the place_id is FAO:<F_CODE>
  F_LEVEL: FAO area level; always MAJOR here
  F_STATUS: endorsed (by the FAO regional fishery bodies) or pending
  F_NAME: area name as FAO's database writes it
  OCEAN: ocean the area belongs to (Arctic, Atlantic, Indian, Pacific)
  SUBOCEAN: FAO's number of the ocean sector
  F_AREA: the area code at the MAJOR level (same as F_CODE); the subarea, division, subdivision and subunit fields are empty
  NAME_EN: English name, the place name (e.g. Atlantic, Northwest)
  NAME_FR: French name
  NAME_ES: Spanish name
