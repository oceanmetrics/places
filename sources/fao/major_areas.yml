# fao_major_areas: FAO Major Fishing Areas for Statistical Purposes (19 areas), CC BY 4.0
slug: fao_major_areas
title: FAO Major Fishing Areas
description: >-
  The 19 FAO Major Fishing Areas for Statistical Purposes (marine areas 18 to 88: Atlantic, Indian, Pacific,
  Arctic and the Antarctic and Southern Ocean sectors), edition 2026.1.0 (revised 2026-02-02): the areas in which
  FAO and the regional fishery bodies report catch statistics. One polygon (multi-part) per area, keyed by the FAO
  area code (`F_CODE`, e.g. 21 Atlantic, Northwest). The geometry is the coastline-erased layer (intermediate
  resolution, aligned with UN countries and territories), so each area covers open water only. Together with the
  Marine Regions EEZs, the areas split the high seas into pieces (collection `fao_high_seas`). The designations
  employed and the presentation of material are for illustration only and do not imply the expression of any
  opinion whatsoever on the part of FAO concerning the legal or constitutional status of any country, territory or
  sea area or concerning the delimitation of frontiers or boundaries. Source: FAO GeoServer WFS layer
  fifao:FAO_AREAS_ERASE filtered to F_LEVEL = 'MAJOR'. The coarser FAO levels (subareas, divisions, subdivisions,
  subunits) are not in this collection.
