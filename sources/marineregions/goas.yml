# mr_goas: Marine Regions (VLIZ) Global Oceans and Seas (10 features), CC BY 4.0
slug: mr_goas
title: Marine Regions Global Oceans and Seas
description: >-
  Global Oceans and Seas, version 1 (2021-12-14): the boundaries between the 10 main oceans and seas (Arctic,
  North and South Atlantic, North and South Pacific, Southern and Indian oceans, Baltic Sea, Mediterranean
  Region, South China and Eastern Archipelagic Seas), largely from IHO Special Publication 23 (1953). The layer
  carries no MRGID; each feature is keyed to the gazetteer record of the same name and extent (IHO Sea Area or
  General Sea Area), see `mrgid`. Marine Regions states the data has no legal value whatsoever and is not
  meant to be used for legal, economic (resource exploration) or navigational purposes; it expresses no opinion
  on the legal status of any country, territory or area or its delimitation. Source: Marine Regions WFS layer
  MarineRegions:goas (geo.vliz.be). Cite as: Flanders Marine Institute (2021). Global Oceans and Seas, version
  1. Available online at https://www.marineregions.org/. https://doi.org/10.14284/542.
