# mr_high_seas: Marine Regions (VLIZ) High Seas (1 feature), CC BY 4.0
slug: mr_high_seas
title: Marine Regions High Seas
description: >-
  The High Seas, version 2 (2024-10-10), from the VLIZ Maritime Boundaries Geodatabase: all parts of the sea not
  included in an exclusive economic zone, territorial sea, internal waters or archipelagic waters of a state
  (UNCLOS). One global feature. Marine Regions states the data has no legal value whatsoever and is not meant to
  be used for legal, economic (resource exploration) or navigational purposes; it expresses no opinion on the
  legal status of any country, territory or area or its delimitation. Source: Marine Regions WFS layer
  MarineRegions:high_seas (geo.vliz.be). Cite as: Flanders Marine Institute (2024). Maritime Boundaries
  Geodatabase: High Seas, version 2. Available online at https://www.marineregions.org/.
  https://doi.org/10.14284/696.
authority: MRGID
place_type: high_seas
version: 1.0.0
cadence: monthly
license: CC-BY-4.0
license_url: https://creativecommons.org/licenses/by/4.0/
license_note: >-
