source_title: Marine Regions (VLIZ)
source_home: https://www.marineregions.org/
place_url: "https://www.marineregions.org/gazetteer.php?p=details&id={mrgid}"
# neighbouring zones share borders: simplify each shared edge once, so they meet without slivers at low zooms
# (mr_eez z3 over Europe: 31 overlapping neighbour pairs -> 10, the same archive size; 2026-10-21)
tile_args: ["--detect-shared-borders"]
# reference collection: VLIZ asked us not to republish the products as-is and to refer to marineregions.org (Bart
# Vanhoorne, 2026-10-16 12:40), then agreed to map display from their GeoWebCache tiles, single-feature WFS on demand,
# a public index and derived tables ("All fine", 2026-10-16 22:49; always use the cached tiles, not plain WMS). the
# parquet and PMTiles stay internal (catalog/staging and the build machine's places-internal store)
reference:
  tiles: "https://geo.vliz.be/geoserver/MarineRegions/gwc/service/wmts?SERVICE=WMTS&VERSION=1.0.0&REQUEST=GetTile&LAYER=high_seas&STYLE=&TILEMATRIXSET=EPSG:900913&TILEMATRIX=EPSG:900913:{z}&TILEROW={y}&TILECOL={x}&FORMAT=image/png"
  maxzoom: 12
  link: "https://doi.org/10.14284/696"
  # no feature_url: one global polygon per place (oceans, the high seas) is too heavy to fetch per view
  # identify on click (one small JSON per click, PROPERTYNAME so no geometry comes back; plain WMS, not GWC, which
  # ignores PROPERTYNAME): 2026-10-20
  info_url: "https://geo.vliz.be/geoserver/MarineRegions/wms?SERVICE=WMS&VERSION=1.1.1&REQUEST=GetFeatureInfo&LAYERS=MarineRegions:high_seas&QUERY_LAYERS=MarineRegions:high_seas&STYLES=&SRS=EPSG:4326&BBOX={bbox}&WIDTH=101&HEIGHT=101&X=50&Y=50&INFO_FORMAT=application/json&FEATURE_COUNT=5&PROPERTYNAME=mrgid"
  info_id: mrgid
place_id:
  template: "MRGID:{mrgid}{mr_part}"
  pattern: '^MRGID:\d+(:[a-z0-9-]+)?$'
name: "{name}"
source_id: "{mrgid}"
status:
  value: current
  source: https://www.marineregions.org/downloads.php
  date: data_last_edit
column_docs:
  mrgid: Marine Regions Geographic IDentifier of the record (integer); resolves at the mrgid_uri
  mrgid_uri: canonical Marine Regions URI of the record (http://marineregions.org/mrgid/{mrgid}); content-negotiated
  mr_product: Marine Regions data product (Maritime Boundaries Geodatabase layer) the feature comes from
  mr_product_version: version of that product
  mr_product_doi: DOI of that product version (https://doi.org/{doi}); cite it
  mr_license: licence of the product (CC-BY-4.0)
  mr_modified: release date of the product version (the WFS serves no per-feature edit date)
  mr_part: "':'-suffix that keeps place_id unique when two features share an MRGID; empty for the first or only feature"
