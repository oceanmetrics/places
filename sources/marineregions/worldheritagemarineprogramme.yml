# mr_world_heritage_marine: Marine Regions (VLIZ) UNESCO World Heritage Marine Sites (60 features), CC BY 4.0
slug: mr_world_heritage_marine
title: Marine Regions UNESCO World Heritage Marine Sites
description: >-
  Boundaries of the marine sites inscribed on the UNESCO World Heritage List (v02, as of 1 January 2023),
  compiled from the UNESCO World Heritage Marine Programme and Protected Planet and hosted by Marine Regions. 60
  polygons for the marine sites (`buffer` marks buffer-zone polygons). Marine Regions states the data has no
  legal value whatsoever and is not meant to be used for legal, economic (resource exploration) or navigational
  purposes; it expresses no opinion on the legal status of any country, territory or area or its delimitation.
  Source: Marine Regions WFS layer MarineRegions:worldheritagemarineprogramme (geo.vliz.be). Cite as: UNESCO
  (2023). Boundaries of UNESCO World Heritage Marine Sites, v02. Available online at
  https://www.marineregions.org/. https://doi.org/10.14284/592.
