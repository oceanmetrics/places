# mr_contiguous_zones: Marine Regions (VLIZ) Contiguous Zones (24 NM) (220 features), CC BY 4.0
slug: mr_contiguous_zones
title: Marine Regions Contiguous Zones (24 NM)
description: >-
  Contiguous Zones (24 NM) of the world, version 4 (2023-10-25), from the VLIZ Maritime Boundaries Geodatabase:
  the band of water from the outer edge of the territorial sea to up to 24 nautical miles from the baseline. 220
  features; `mrgid_eez` links each to its Exclusive Economic Zone. Marine Regions states the data has no legal
  value whatsoever and is not meant to be used for legal, economic (resource exploration) or navigational
  purposes; it expresses no opinion on the legal status of any country, territory or area or its delimitation.
  Source: Marine Regions WFS layer MarineRegions:eez_24nm (geo.vliz.be). Cite as: Flanders Marine Institute
  (2023). Maritime Boundaries Geodatabase: Contiguous Zones (24NM), version 4. Available online at
  https://www.marineregions.org/. https://doi.org/10.14284/630.
