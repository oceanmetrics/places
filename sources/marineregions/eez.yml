# mr_eez: Marine Regions (VLIZ) Exclusive Economic Zones (200 NM) (285 features), CC BY 4.0
slug: mr_eez
title: Marine Regions Exclusive Economic Zones (200 NM)
description: >-
  Exclusive Economic Zones (200 NM) of the world, version 12 (2023-10-25), from the VLIZ Maritime Boundaries
  Geodatabase: the sea zone extending from a state's coast or baseline over which the state has special rights
  to explore and use marine resources, including the delimitation of disputed areas and joint regimes
  (`pol_type`). 285 features, keyed by MRGID. Marine Regions states the data has no legal value whatsoever and
  is not meant to be used for legal, economic (resource exploration) or navigational purposes; it expresses no
  opinion on the legal status of any country, territory or area or its delimitation. Source: Marine Regions WFS
  layer MarineRegions:eez (geo.vliz.be). Cite as: Flanders Marine Institute (2023). Maritime Boundaries
  Geodatabase: Maritime Boundaries and Exclusive Economic Zones (200NM), version 12. Available online at
  https://www.marineregions.org/. https://doi.org/10.14284/632.
