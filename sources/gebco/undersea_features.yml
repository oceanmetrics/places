  - {kind: arcgis, component: line, url: "https://services2.arcgis.com/C8EMgrsFcRFL6LrL/arcgis/rest/services/Undersea_Features/FeatureServer/1", item_id: f09d579c68b84c5184fef1ac69ea7b24, expected_count: 1128, page_size: 1000}
  - {kind: arcgis, component: point, url: "https://services2.arcgis.com/C8EMgrsFcRFL6LrL/arcgis/rest/services/Undersea_Features/FeatureServer/0", item_id: f09d579c68b84c5184fef1ac69ea7b24, expected_count: 2632, page_size: 1000}
