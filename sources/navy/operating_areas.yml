# navy_operating_areas: Military operating areas (U.S. Navy, OPAREAs and range complexes) (35), MarineCadastre scan 2026-10-20 #11
slug: navy_operating_areas
title: Military operating areas (U.S. Navy)
description: >-
  U.S. Navy operating areas (OPAREAs), range complexes and training and testing areas at sea (35 polygons;
  `oparearangecomplextype` oparea, rangeComplex or tt), where national defense training and system tests are
  routinely conducted and coordinated through the Local Notice to Mariners: e.g. VACAPES, Narragansett Bay, SOCAL
  Range Complex, Mariana Islands Training and Testing. A subset of the Navy Common Operational Picture shared with
  MarineCadastre.gov for ocean planning. The id is the unique short `featurename` (NAVY:OPAREA:vacapes-oparea);
  the name is its long form `featuredescription`; `operationalstatus` (In Service, Temporary) is copied to
  `status_upstream`.
