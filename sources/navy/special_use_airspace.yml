# navy_special_use_airspace: Military special use airspace (U.S. Navy / FAA, DAFIF) (769), MarineCadastre scan 2026-10-20 #12
slug: navy_special_use_airspace
title: Military special use airspace (U.S. Navy)
description: >-
  Special use airspace (SUA) in and around the Navy's coastal and offshore operating areas (769 polygons): warning
  areas, restricted areas, military operations areas (MOAs), alert, prohibited and danger areas, air traffic control
  assigned airspace (ATCAA), altitude reservations, air grids, corridors and the air defense identification zones,
  with floor and ceiling altitudes (feet, `floorreferencelevel` / `ceilingreferencelevel`), controlling and
  scheduling agency and the Navy `coparea`. SUA includes the surface and subsurface training areas beneath it. From
  the NGA Digital Aeronautical Flight Information File (DAFIF), as a subset of the Navy Common Operational Picture for
  ocean planning. Every type is kept: no type is wholly on land, though some restricted areas and MOAs in the set
  (e.g. Avon Park and Pinecastle, FL; El Centro, CA) lie inland. The layer has no airspace designator attribute, so
  the id is the type and name (NAVY:SUA:warning:key-west-fl); the repeats of a name (Key West, FL has 15 warning
  areas) get ':part', ':part-2', ... in objectid order. `airspacestatus` is copied to `status_upstream`. Not for
  navigation or flight planning.
