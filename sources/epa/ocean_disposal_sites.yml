# epa_ocean_disposal_sites: EPA-designated MPRSA ocean disposal sites (96), MarineCadastre scan 2026-10-20 #2
slug: epa_ocean_disposal_sites
title: EPA-designated ocean disposal sites (MPRSA)
description: >-
  Ocean sites designated by the U.S. Environmental Protection Agency under the Marine Protection, Research, and
  Sanctuaries Act (MPRSA) and listed in 40 CFR 228.15 (96 polygons): mostly ocean dredged material disposal sites,
  plus placement and fish waste sites (`SiteType`), with official name (`OfficialNa`), EPA region, radius and depths
  (-99 = not given). The id is EPA's site code `DumpSiteCo` (EPA:US193). One recently designated site, Isle of
  Shoals North (IOSN), is served with the placeholder code USXXX: its id EPA:USXXX will change when EPA assigns a
  code. Coordinates were transformed to WGS 84 by EPA. For information only: not suitable for legal purposes.
