# usace_danger_zones: Danger zones and restricted areas (USACE) (422), MarineCadastre first-15 layer 15
slug: usace_danger_zones
title: Danger zones and restricted areas (USACE)
description: >-
  Danger zones, restricted areas and similar regulated water areas in coastal and marine waters (422 polygons)
  from 33 CFR part 334 and the raster navigational charts; `agencyofuse` is the using agency (mostly U.S. Navy
  and Army). A regulation may have several polygons: the id is state + CFR section, and repeats get ':part'
  suffixes in OBJECTID order.
