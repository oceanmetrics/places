# Cloudflare Worker fronting storage.oceanmetrics.io/* (every published prefix; see README.md for the runbook).
# Deployed to https://om-gazetteer.ben-f07.workers.dev (Ocean Metrics Cloudflare account) since 2026-10-22.
name = "om-gazetteer"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# the production host: a Cloudflare custom domain (the proxied DNS record is created by the deploy); Ben moved the
# zone to Cloudflare and said "route it" on 2026-10-23; rollback = remove this line and redeploy (the wildcard A to msens returns)
routes = [{ pattern = "storage.oceanmetrics.io", custom_domain = true }]
workers_dev = true   # the preview url https://om-gazetteer.ben-f07.workers.dev stays for the range-read workflow and smoke tests

[triggers]
crons = ["*/15 * * * *"]   # usage rollup stub

[vars]
FULLFILE_BYTES = "16777216"   # un-ranged parquet GET over 16 MiB is flagged `fullfile`
AE_DATASET     = "om_gazetteer"
# CF_ACCOUNT_ID = "..."       # rollup only; set CF_API_TOKEN with `wrangler secret put CF_API_TOKEN`

# the US (ENAM) buckets are the default (Ben, 2026-10-23): oceanmetrics-io-public-enam was copied server-side from the
# EEUR bucket oceanmetrics-io-public plus a delta from S3 (rclone check against S3: 818,890 matching, 0 differences);
# the EEUR buckets oceanmetrics-io-public and oceanmetrics-io-unlisted are kept until Ben deletes them
[[r2_buckets]]
binding     = "BUCKET"
bucket_name = "oceanmetrics-io-public-enam"

# unlisted copies (Marine Regions GeoParquet + PMTiles, VLIZ email 2026-10-22): /unlisted/gazetteer/... with a key only
[[r2_buckets]]
binding     = "UNLISTED"
bucket_name = "oceanmetrics-io-unlisted-enam"

[[kv_namespaces]]
binding = "KEYS"
id      = "46f26ef9bf444bff9b220a3b9fe6bff8"

[[analytics_engine_datasets]]
binding = "METRICS"
dataset = "om_gazetteer"

# keyless data reads (parquet/pmtiles/tif/...): every request counts. One Place page load is ~108 requests, so 1200 a
# minute per ip lets a session of several page views through; tune from `blob5 = 'anonymous'` rows
[[ratelimits]]
name         = "ANON_LIMITER"
namespace_id = "1001"
simple       = { limit = 1200, period = 60 }

# keyless full-file reads (un-ranged parquet over FULLFILE_BYTES, class `fullfile`): a separate, lower budget so a
# bulk download is throttled long before the general one
[[ratelimits]]
name         = "ANON_FULLFILE_LIMITER"
namespace_id = "1003"
simple       = { limit = 60, period = 60 }

# per-key request rate; the byte cap is the real budget (KV usage totals)
[[ratelimits]]
name         = "KEY_LIMITER"
namespace_id = "1002"
simple       = { limit = 1200, period = 60 }
