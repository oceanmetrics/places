# weekly refresh of the published gazetteer collections built from sources/ (BOEM, NOAA, USACE, FWS, GEBCO, CalCOFI):
# re-fetch only what changed upstream, rebuild those collections, publish them to
# s3://oceanmetrics.io-public/gazetteer/ = https://storage.oceanmetrics.io/gazetteer/, then refresh what is derived
# from them (place x H3 membership, index/, layers.json).
#
# change detection (gazetteer/pipeline.py `detect`): per source, the ArcGIS layer's `editingInfo.dataLastEditDate` and
# record count (two tiny requests) are compared with the provenance.json published next to the collection; a layer
# that serves no edit date (BOEM Pacific map service) is compared on its payload checksum, the NOAA zip on its HTTP
# validators. nothing changed = nothing rebuilt = nothing published. a collection that is not published yet (the held
# mr_*, noaa_esa_critical_habitat, fws_critical_habitat_final: catalog/staging/RUNBOOK_PUBLISH.md) is never published
# here; publish it by hand first.
#
# runs on the Mac mini (`macmini` runner, shared with oceanmetrics/erddap-places stats.yml and obis-h3.yml: one job at a
# time). moved from oceanmetrics/erddap-places gazetteer-sync.yml on 2026-10-16, when this repo became the only
# publisher of the place collections. host tools come from Homebrew (uv, tippecanoe, aws, rclone, python3); portolan and
# rashid are uv tools. the writes go through oceanmetrics/platform scripts/om-publish.sh (R2 through the host's rclone
# wrapper, S3 through the host's AWS profile); the repository holds no secrets, and if AWS_ACCESS_KEY_ID /
# AWS_SECRET_ACCESS_KEY are ever added they take precedence for S3.
#
# publishing goes through scripts/publish_collections.sh --republish (the portolan 0.8.0 guards, the rashid gate, the
# root versions.json / catalog.json merged into the live ones). reads of the published catalog go to the S3 origin: the
# CDN caches its JSON for a day, so it would hide a publish of the last 24 h from detect and next-version.
name: gazetteer-sync

on:
  schedule:
    - cron: '43 7 * * 1'          # Mondays 07:43 UTC
  workflow_dispatch:
    inputs:
      slug:
        description: 'only this collection (blank = every collection)'
        required: false
        default: ''
      force:
        description: 'rebuild even if the source did not change'
        type: boolean
        required: false
        default: false
      publish:
        description: 'publish to S3 when done (off = build and check only)'
        type: boolean
        required: false
        default: true
      refresh:
        description: 'refresh index/ and layers.json even if nothing was rebuilt (e.g. after a builder change)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read                   # nothing is committed: the published ledgers are the version history

# one gazetteer writer at a time in this repo
concurrency:
  group: gazetteer-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: [self-hosted, macmini]
    timeout-minutes: 180
    env:
      AWS_DEFAULT_REGION: us-east-1
      ORIGIN: https://s3.us-east-1.amazonaws.com/oceanmetrics.io-public/gazetteer
      # every upload goes through oceanmetrics/platform scripts/om-publish.sh (both stores, R2 then S3; never deletes),
      # checked out below; the R2 keys stay on the host like the AWS profile (~/.config/oceanmetrics/rclone-r2.sh)
      OM_PUBLISH: ${{ github.workspace }}/.om-platform/scripts/om-publish.sh
      # the Python uv fetches: left to itself it took 3.15.0, which has no pyarrow wheel (erddap-places, 2026-10-13)
      UV_PYTHON: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: oceanmetrics/platform
          path: .om-platform
          sparse-checkout: scripts/om-publish.sh
          sparse-checkout-cone-mode: false

      # Homebrew's uv, tippecanoe and aws; uv tools (portolan, rashid) land in ~/.local/bin
      - name: host tools
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin"  >> "$GITHUB_PATH"
          export PATH="/opt/homebrew/bin:$HOME/.local/bin:$PATH"
          for t in python3 aws uv tippecanoe; do
            command -v "$t" >/dev/null || { echo "::error::$t is not on the runner host (brew install $t)"; exit 1; }
          done
          python3 --version; aws --version; uv --version; tippecanoe --version

      - name: install portolan and rashid
        run: |
          uv tool install --upgrade portolan-cli
          uv tool install --upgrade rashid
          portolan --version; rashid --version

      - name: unit tests (rules, status overlay, antimeridian, licence and attribution, PMTiles metadata)
        run: uv run --group dev pytest -q -m "not network"

      - name: which published collections changed upstream
        id: detect
        run: |
          slugs=""
          if [ -n "${{ inputs.slug }}" ]; then slugs="--slug ${{ inputs.slug }}"; fi
          uv run build.py detect $slugs --published-base "$ORIGIN" --json-out changed.json
          python3 - "${{ inputs.force }}" <<'PY'
          import json, sys
          rows = json.load(open("changed.json"))
          for r in rows:
              published = r.get("reason") != "not published yet"
              r["changed"] = published and (r["changed"] or sys.argv[1] == "true")
          json.dump(rows, open("changed.json", "w"))
          # a probe that failed (an upstream outage) skips that collection this week, visibly
          for r in rows:
              if r.get("error"):
                  print(f"::warning::{r['slug']}: {r['reason']} (not checked this run)")
          PY
          list=$(python3 -c "import json; print(' '.join(r['slug'] for r in json.load(open('changed.json')) if r['changed']))")
          echo "changed=$list" >> "$GITHUB_OUTPUT"
          echo "changed collections: ${list:-none}" | tee -a "$GITHUB_STEP_SUMMARY"

      # a failed fetch of one collection must not throw away the others: keep going, publish what was built, fail at the end
      - name: rebuild the changed collections
        id: build
        if: ${{ steps.detect.outputs.changed != '' }}
        continue-on-error: true
        run: |
          failed=""
          built=""
          for slug in ${{ steps.detect.outputs.changed }}; do
            version=$(uv run build.py next-version --slug "$slug" --published-base "$ORIGIN")
            if uv run build.py build --slug "$slug" --version "$version"; then
              built="$built $slug:$version"
            else
              failed="$failed $slug"
            fi
          done
          echo "built=${built# }" >> "$GITHUB_OUTPUT"
          echo "failed=${failed# }" >> "$GITHUB_OUTPUT"
          echo "built:${built:- none}  failed:${failed:- none}" | tee -a "$GITHUB_STEP_SUMMARY"
          [ -z "$failed" ]

      - name: check the built collections (parquet, PMTiles attribution, licence, ids, geometry)
        if: ${{ steps.build.outputs.built != '' }}
        run: |
          uv run build.py check $(for b in ${{ steps.build.outputs.built }}; do echo "--slug ${b%%:*}"; done)
          uv run --group dev pytest -q -m "not network" tests/test_staged.py

      # catalog/pub/ is the published metadata tree (no data files); actions/checkout cleans it, so each run pulls afresh
      - name: publish the rebuilt collections
        if: ${{ steps.build.outputs.built != '' && (github.event_name == 'schedule' || inputs.publish) }}
        env:
          AWS_ACCESS_KEY_ID    : ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; fi
          aws sts get-caller-identity
          aws s3 sync s3://oceanmetrics.io-public/gazetteer/ catalog/pub/ --only-show-errors \
            --exclude '*.parquet' --exclude '*.pmtiles' --exclude '*.tif' --exclude '*.nc' --exclude '*/h3/*' \
            --exclude 'stats/*' --exclude 'rasters/*' --exclude 'climatology/*' --exclude 'series/*'
          for b in ${{ steps.build.outputs.built }}; do
            slug=${b%%:*}; want=${b##*:}
            reason=$(python3 -c "import json,sys; print(next(r['reason'] for r in json.load(open('changed.json')) if r['slug'] == sys.argv[1]))" "$slug")
            bash scripts/publish_collections.sh --republish --version "$want" --note "gazetteer-sync: $reason" "$slug"
          done

      # the H3 membership of a rebuilt collection no longer matches its parquet (layers.json drops a stale one), and the
      # index and layers.json list versions and checksums: rebuild all three from the published catalog, upload last.
      # `refresh` (manual runs) rebuilds index/ and layers.json alone when nothing changed, e.g. after a builder change
      - name: refresh H3 membership, index/ and layers.json
        if: ${{ (steps.build.outputs.built != '' && (github.event_name == 'schedule' || inputs.publish)) || inputs.refresh }}
        env:
          AWS_ACCESS_KEY_ID    : ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; fi
          # reference collections (mr_*: no public parquet) have no membership yet; their index rows come from the
          # private copies publish_collections.sh keeps in ~/data/oceanmetrics/places-internal (build_index.py --internal)
          isref() { python3 -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1])).get("gazetteer:reference") else 1)' "catalog/staging/$1/collection.json"; }
          slugs=$(for b in ${{ steps.build.outputs.built }}; do s=${b%%:*}; isref "$s" || echo "--slug $s"; done)
          lj="$RUNNER_TEMP/layers.json"
          uv run scripts/build_layers_json.py --no-local --out "$lj"
          # the changed slugs, plus --missing: every polygon vector layer whose membership is absent or stale on the
          # bucket, so each one has `h3` after every sync (layers.json schema rule), not only the ones rebuilt today
          uv run scripts/build_h3_membership.py $slugs --missing --layers "file://$lj" --out "$RUNNER_TEMP/h3" --upload
          uv run scripts/build_layers_json.py --no-local --out "$lj"
          uv run scripts/build_index.py --no-local --out "$RUNNER_TEMP/index"
          # om-publish.sh, both stores: index/ first, then layers.json (its previous R2 copy under gazetteer/_history/)
          "$OM_PUBLISH" --really --exclude '.portolan/*' "$RUNNER_TEMP/index" gazetteer/index
          "$OM_PUBLISH" --really --keep-history "$lj" gazetteer/index --as layers.json
          "$OM_PUBLISH" --really "$lj" gazetteer --as layers.json

      - name: fail the job if a collection failed to build
        if: ${{ steps.build.outcome == 'failure' }}
        run: |
          echo "::error::failed to build: ${{ steps.build.outputs.failed }} (the other changed collections were published)"
          exit 1
