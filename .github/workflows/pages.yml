# build the website (web/) and publish it to GitHub Pages at https://oceanmetrics.io/places/
# (project sites serve under the org domain, like oceanmetrics/erddap-places). places.oceanmetrics.io
# on Cloudflare Workers (web/wrangler.jsonc) stays the eventual home; this is live until then.
name: pages

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # until Day 5 (2026-10-26) the client is a file: link to a sibling checkout of oceanmetrics/platform
      # (web/package.json -> ../../platform/packages/places), so both repos sit side by side in the workspace
      - uses: actions/checkout@v4
        with:
          path: places
      - uses: actions/checkout@v4
        with:
          repository: oceanmetrics/platform
          ref: main
          path: platform
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            places/web/package-lock.json
            platform/package-lock.json
      # web/ imports the client from platform/packages/places/src (vite alias), so the platform's deps must be installed
      - run: npm ci
        working-directory: platform
      - run: npm ci
        working-directory: places/web
      - run: npm run check
        working-directory: places/web
      - run: npm run test
        working-directory: places/web
      - run: npm run build -- --base=/places/
        working-directory: places/web
      # SPA fallback: GitHub Pages serves 404.html for unknown paths (/places/p/NMS:PMNM, /places/credits)
      - run: cp places/web/dist/index.html places/web/dist/404.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true   # first run creates the Pages site (workflow build type)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: places/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
