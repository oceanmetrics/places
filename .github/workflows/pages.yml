# build the website (web/) and publish it to GitHub Pages at https://oceanmetrics.io/places/
# (project sites serve under the org domain, like oceanmetrics/erddap-places). places.oceanmetrics.io
# on Cloudflare Workers (web/wrangler.jsonc) stays the eventual home; this is live until then.
name: pages

on:
  push:
    branches: [main]
    paths: ['web/**', 'client/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            client/package-lock.json
      # web/ imports the client from ../client/src (vite alias), so the client's own deps must be installed
      - run: npm ci
        working-directory: client
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm run test
        working-directory: web
      - run: npm run build -- --base=/places/
        working-directory: web
      # SPA fallback: GitHub Pages serves 404.html for unknown paths (/places/p/NMS:PMNM, /places/credits)
      - run: cp web/dist/index.html web/dist/404.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true   # first run creates the Pages site (workflow build type)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
